V.checkout=()=>`${stp(2)}<div class="w"><div class="cg"><form id="of" class="col" onsubmit="order(event)"><div id="dl"></div><div class="card" id="bag"></div><section class="card"><h2 class="ch2"><i>2</i>Delivery Address</h2><div class="fr"><label>Full Name *<input name="name" required placeholder="Aarav Sharma"></label><label>Phone Number *<input name="phone" required pattern="[0-9+ ]{10,14}" title="Enter a valid phone number" placeholder="+91 98765 43210"></label></div><label>Street Address & Apartment *<input name="addr" required placeholder="Flat 402, Prestige Tower, 12th Main, Indiranagar"></label><div class="fr3"><label>City *<input name="city" required placeholder="Bengaluru"></label><label>State *<input name="state" required placeholder="Karnataka"></label><label>Pincode *<input name="pin" required pattern="[0-9]{6}" title="6-digit pincode" placeholder="560038"></label></div><label style="margin:0">Address Type</label><div class="ats">${['Home','Office','Other'].map((t,i)=>`<label class="ch"><input class="vh" type="radio" name="at" value="${t}" ${i?'':'checked'}>${t}</label>`).join('')}</div></section><section class="card"><h2 class="ch2"><i>3</i>Payment Method<span class="sc">🔒 100% Safe & Secure</span></h2>${[['upi','UPI (Google Pay, PhonePe, Paytm, BHIM)','Instant 1-click refund to source account on returns',1],['card','Credit / Debit Cards','Visa, Mastercard, RuPay, Maestro'],['nb','Net Banking','All major Indian banks supported (HDFC, ICICI, SBI, Axis)'],['cod','Cash on Delivery (COD)','Pay via cash or UPI QR code at your doorstep upon arrival']].map(([v,t,s,u],i)=>`<label class="po"><input class="vh" type="radio" name="pm" value="${v}" ${i?'':'checked'}><b>${t}</b>${u?'<em>RECOMMENDED</em>':''}<small>${s}</small>${u?`<span class="up"><b style="font:500 13px Inter">Enter UPI ID (optional)</b><span style="display:flex;gap:8px;max-width:448px;margin:4px 0"><input name="upi" placeholder="username@okhdfcbank" style="flex:1;height:44px;border:1px solid #c3c6d7;border-radius:8px;padding:0 13px"><button class="b s" style="background:var(--pd)">Verify & Pay</button></span><small>You'll complete payment in your UPI app on the next step.</small></span>`:''}</label>`).join('')}</section></form><div class="col" id="side"></div></div></div>`;
const dlH=()=>{const s=tot().s,ok=s>=999;return `<div class="card fd"><div><span>${ok?'🎉 Congratulations! You have unlocked <em>FREE EXPRESS DELIVERY</em>':'Add ₹'+f(999-s)+' more to unlock <em>FREE EXPRESS DELIVERY</em>'}</span>${ok?'<span class="ul">Unlocked</span>':''}</div><div class="bar"><i style="width:${Math.min(100,s/9.99)}%"></i></div></div>`};
const bagH=()=>`<h2 class="ch2" style="border:0;margin:0">Shopping Bag <small>(${tot().n} items selected)</small></h2>`+(cart.length?cart.map((c,i)=>{const p=P[c.id-1];return `<div class="it"><div class="th"><img src="${IMG+p.i}.png" alt="${p.n}"><b>${p.o}% OFF</b></div><div class="ii"><div><div class="tp"><div><small>${p.b}</small><h3>${p.n}</h3></div><div class="ra"><b>₹${f(p.p*c.q)}</b><s>₹${f(p.m*c.q)}</s></div></div><div class="sp">${c.s?`<span>Size: ${c.s}</span>`:''}<span class="in">● In Stock</span></div></div><div class="ac"><div class="qt"><button type="button" onclick="qty(${i},-1)">−</button><b>${c.q}</b><button type="button" onclick="qty(${i},1)">+</button></div><span><button type="button" onclick="mv(${i})">♡ Move to Wishlist</button><button type="button" class="rm" onclick="rm(${i})">🗑 Remove</button></span></div></div></div>`}).join(''):'<p class="em">Your bag is empty. <a href="#/shop">Continue shopping →</a></p>');
const sideH=()=>{const t=tot();return `<div class="card sm"><h3>🏷 Coupons & Offers</h3><div class="cr"><input id="cc" placeholder="Enter coupon code"><button type="button" class="b d s" onclick="apply()">Apply</button></div>${cp?`<div class="ap"><div><b>${cp}</b><br>₹${f(t.d)} saved on this purchase</div><button type="button" onclick="cp=null;save();draw()">REMOVE</button></div>`:''}<div class="cl">${Object.keys(CP).filter(x=>x!=cp).map(x=>`<div><div><span>${x}</span><small>${CP[x].t}</small></div><button type="button" onclick="apply('${x}')">Apply</button></div>`).join('')}</div></div><div class="card sm"><h3 style="border-bottom:1px solid rgba(195,198,215,.2);padding-bottom:9px">Price Breakdown</h3><div class="rw">Bag Total (${t.n} items)<b>₹${f(t.s)}</b></div><div class="rw">Product Discount<b class="g">-₹${f(t.pd)}</b></div>${t.d?`<div class="rw">Coupon (${cp})<b class="g">-₹${f(t.d)}</b></div>`:''}<div class="rw">Delivery Fee<b>${t.dl?'₹'+t.dl:'<s>₹99</s> <span class="g">FREE</span>'}</b></div><div class="rw">Estimated Taxes & Cess<b>Included</b></div><div class="tt"><div><b>Total Payable Amount</b><small>Inclusive of all local taxes</small></div><strong>₹${f(t.total)}</strong></div>${t.save?`<div class="sv">🎉 You are saving ₹${f(t.save)} on this order!</div>`:''}<button class="b big f" form="of" ${cart.length?'':'disabled'}>${ic(D.lock,13)} Place Order & Pay ₹${f(t.total)}</button></div><div class="tbs">${[['7-Day Easy Returns','Hassle-free reverse pick up at zero fee'],['Instant UPI Refund','Processed within 2 hours of return scan'],['Safe & Contactless Delivery','Verified vaccinated delivery executives']].map(([a,b])=>`<div><b>${a}</b><small>${b}</small></div>`).join('')}</div>`};
function draw(){if(!$('#side'))return;$('#dl').innerHTML=dlH();$('#bag').innerHTML=bagH();$('#side').innerHTML=sideH()}
function qty(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);else if(cart[i].q>10)cart[i].q=10;save();draw()}
function rm(i){cart.splice(i,1);save();draw()}
function mv(i){const id=cart[i].id;wl.includes(id)||wl.push(id);rm(i);toast('Moved to wishlist')}
function apply(c){c=(c||$('#cc').value).trim().toUpperCase();const k=CP[c],s=tot().s;if(!k)return toast('Invalid coupon code');if(k.min&&s<k.min)return toast(`Add ₹${f(k.min-s)} more to use ${c}`);cp=c;save();draw();toast(c+' applied')}
function order(e){e.preventDefault();if(!cart.length)return toast('Your bag is empty');const d=new FormData(e.target),t=tot(),o={type:'order',orderId:'UC'+Date.now().toString(36).toUpperCase(),name:d.get('name'),phone:d.get('phone'),address:d.get('addr'),city:d.get('city'),state:d.get('state'),pincode:d.get('pin'),addressType:d.get('at'),payment:d.get('pm'),items:cart.map(c=>`${P[c.id-1].n} x${c.q}${c.s?' ('+c.s+')':''}`).join('; '),total:t.total,coupon:t.d?cp:''},b=document.querySelector('.big');b.disabled=true;send(o,()=>paid(o),()=>{toast('Could not place your order. Check your connection and try again.');b.disabled=false})}
function paid(o){LS.set('uc_last',{id:o.orderId,total:o.total});if(o.payment=='cod')return done(o,`<p>Please keep ₹${f(o.total)} ready — pay in cash or UPI when your order arrives.</p>`);if(CFG.PAY_LINK){cart=[];save();location.href=CFG.PAY_LINK;return}if(CFG.UPI_ID){const u=`upi://pay?pa=${CFG.UPI_ID}&pn=${encodeURIComponent(CFG.PAYEE)}&am=${o.total}&cu=INR&tn=${o.orderId}`;return done(o,`<p>Pay ₹${f(o.total)} to <b>${CFG.UPI_ID}</b> from any UPI app.</p><a class="b" href="${u}">Open UPI app</a>`)}done(o,'<p class="em">Your order is saved. Online payment is not switched on yet — add UPI_ID or PAY_LINK in the CFG block of index.html.</p>')}
function done(o,x){cart=[];cp=null;save();app.innerHTML=stp(4)+`<div class="w"><div class="card cf"><div class="ok">✓</div><h1 class="h2">Order placed!</h1><p>Order ID <b>${o.orderId}</b> · ₹${f(o.total)} · ${PM[o.payment]}</p>${x}<a class="b o" href="#/">Continue shopping</a></div></div>`;scrollTo(0,0)}
function route(){const[r='',a='']=location.hash.slice(2).split('/'),c=r=='checkout',v=V.hasOwnProperty(r)&&r?r:'home';$('.ann').hidden=c;$('#hd').innerHTML=c?H2():H1(r||'home');app.innerHTML=V[v](decodeURIComponent(a));hdr();c?draw():0;r=='best'?$('#best').scrollIntoView():scrollTo(0,0)}
setInterval(()=>{const h=$('#cdh');if(!h)return;let x=Math.floor((end-Date.now())/1e3);if(x<0){end=Date.now()+864e5;x=864e2}h.textContent=p2(x/3600|0);$('#cdm').textContent=p2(x%3600/60|0);$('#cds').textContent=p2(x%60)},1e3);
$('#ft').innerHTML=FT();addEventListener('hashchange',route);route();
</script>
</body>
</html>
